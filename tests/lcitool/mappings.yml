  python3-numpy:
    FreeBSD: py312-numpy

  meson:
    # Use Meson from PyPI wherever Rust is enabled
    Debian:
    Fedora:
    Ubuntu:

  python3-tomli:
    # test using tomllib
    apk:
    Fedora:
